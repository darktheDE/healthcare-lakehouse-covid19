services:
  # NGUỒN DỮ LIỆU POSTGRES SOURCE
  postgres-source:
    image: postgres:15
    container_name: postgres-source
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=hospital_db
    networks:
      - iceberg_net
    ports:
      - "5432:5432"

  metastore-db:
    image: postgres:15
    container_name: metastore-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=metastore_db
    networks:
      - iceberg_net
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "admin", "-d", "metastore_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: tabulario/hive-metastore:latest
    container_name: hive-metastore
    depends_on:
      metastore-db:
        condition: service_healthy
    environment:
      # Database Config
      - DATABASE_HOST=metastore-db
      - DATABASE_PORT=5432
      - DATABASE_DB=metastore_db
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=password
      - DATABASE_TYPE=postgres

      # S3 / MinIO Config (Đúng tên biến script đòi ở dòng 37, 61...)
      - S3_BUCKET=warehouse
      - S3_PREFIX=iceberg
      - S3_REGION=us-east-1
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password

      # Thêm cái này để chắc chắn script không đòi thêm
      - AWS_S3_ENDPOINT=http://minio:9000
    networks:
      - iceberg_net
    ports:
      - "9083:9083"

  # XỬ LÝ DỮ LIỆU - CẤU HÌNH CƠ BẢN TỪ TABULAR
  spark-iceberg:
    image: tabulario/spark-iceberg
    container_name: spark-iceberg
    networks:
      - iceberg_net
    depends_on:
      - minio
      - hive-metastore
    volumes:
      - ./warehouse:/home/iceberg/warehouse
      - ./notebooks:/home/iceberg/notebooks/notebooks
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      # Cấu hình để Spark ghi vào Hive Catalog thay vì REST
      - SPARK_CONF_spark_sql_catalog_demo=org.apache.iceberg.spark.SparkCatalog
      - SPARK_CONF_spark_sql_catalog_demo_catalog-impl=org.apache.iceberg.hive.HiveCatalog
      - SPARK_CONF_spark_sql_catalog_demo_uri=thrift://hive-metastore:9083
      - SPARK_CONF_spark_sql_catalog_demo_warehouse=s3a://warehouse/
    ports:
      - 8888:8888
      - 8080:8080

  # --- TRUY VẤN DỮ LIỆU (TRINO) ---
  trino:
    image: trinodb/trino
    container_name: trino
    networks:
      - iceberg_net
    ports:
      - "8081:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    environment:
      # Giảm xuống 512M để nó nhẹ nhất có thể
      - TRINO_JVM_MAX_HEAP_SIZE=512M
    deploy:
      resources:
        limits:
          memory: 1G

  # --- ĐIỀU PHỐI (AIRFLOW) ---
  airflow:
    image: apache/airflow:2.7.1
    container_name: airflow
    networks:
      - iceberg_net
    depends_on:
      - postgres-source
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:password@postgres-source:5432/hospital_db
    volumes:
      - ./dags:/opt/airflow/dags
    ports:
      - "8082:8080"
    command: standalone

  # --- STORAGE (GIỮ NGUYÊN TỪ TABULAR) ---
  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    ports:
      - 9001:9001
      - 9000:9000
    command: ["server", "/data", "--console-address", ":9001"]

  mc:
    depends_on:
      - minio
    image: minio/mc
    container_name: mc
    networks:
      - iceberg_net
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb -p minio/warehouse;
      tail -f /dev/null
      "

networks:
  iceberg_net: