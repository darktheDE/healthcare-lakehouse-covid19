services:
  # 1. Database nguồn (PostgreSQL) - Chứa dữ liệu thô ban đầu
  postgres-source:
    image: postgres:15-alpine
    container_name: postgres-source
    environment:
      - POSTGRES_USER=${DB_SOURCE_USER:-admin}
      - POSTGRES_PASSWORD=${DB_SOURCE_PASSWORD:-password}
      - POSTGRES_DB=${DB_SOURCE_NAME:-hospital_db}
    networks:
      - lakehouse_net
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/init.sql
      - ../data:/data_source
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_SOURCE_USER:-admin} -d ${DB_SOURCE_NAME:-hospital_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Storage (MinIO) - Cloud Storage giả lập (S3)
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-lakehouse_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-Lakehouse123!}
    networks:
      - lakehouse_net
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MinIO Setup (mc) - Tự động tạo Bucket và phân quyền
  mc:
    image: minio/mc:latest
    container_name: mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse_net
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-lakehouse_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-Lakehouse123!}
      - MINIO_LAKEHOUSE_ACCESS_KEY=${MINIO_LAKEHOUSE_ACCESS_KEY:-lakehouse_admin}
      - MINIO_LAKEHOUSE_SECRET_KEY=${MINIO_LAKEHOUSE_SECRET_KEY:-Lakehouse123!}
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; /usr/bin/mc mb -p local/hospital-lakehouse || true; /usr/bin/mc mb -p local/hospital-lakehouse/raw || true; /usr/bin/mc mb -p local/hospital-lakehouse/bronze || true; /usr/bin/mc mb -p local/hospital-lakehouse/silver || true; /usr/bin/mc mb -p local/hospital-lakehouse/gold || true; /usr/bin/mc mb -p local/hospital-lakehouse/warehouse || true; /usr/bin/mc admin user add local $${MINIO_LAKEHOUSE_ACCESS_KEY} $${MINIO_LAKEHOUSE_SECRET_KEY} || true; /usr/bin/mc admin policy attach local readwrite --user $${MINIO_LAKEHOUSE_ACCESS_KEY} || true; exit 0; "

  # 4. Hive Metastore - Quản lý Metadata cho Iceberg
  metastore-db:
    image: postgres:15-alpine
    container_name: metastore-db
    environment:
      - POSTGRES_USER=${DB_METASTORE_USER:-metastore}
      - POSTGRES_PASSWORD=${DB_METASTORE_PASSWORD:-password}
      - POSTGRES_DB=${DB_METASTORE_NAME:-metastore_db}
    networks:
      - lakehouse_net
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${DB_METASTORE_USER:-metastore}",
          "-d",
          "${DB_METASTORE_NAME:-metastore_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: tabulario/hive-metastore:latest
    container_name: hive-metastore
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "sed -i 's#/opt/hive/bin/hiveserver2#/opt/hive/bin/hive --service metastore#g' /app/run.sh; /app/run.sh",
      ]
    depends_on:
      metastore-db:
        condition: service_healthy
    environment:
      - DATABASE_HOST=metastore-db
      - DATABASE_PORT=5432
      - DATABASE_DB=${DB_METASTORE_NAME:-metastore_db}
      - DATABASE_USER=${DB_METASTORE_USER:-metastore}
      - DATABASE_PASSWORD=${DB_METASTORE_PASSWORD:-password}
      - DATABASE_TYPE=postgres
      - S3_BUCKET=hospital-lakehouse
      - S3_PREFIX=iceberg
      - S3_REGION=us-east-1
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-lakehouse_admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-Lakehouse123!}
    networks:
      - lakehouse_net
    ports:
      - "9083:9083"

  # 5. Airflow - Orchestrator (Kèm sẵn Spark runtime)
  airflow:
    build: .
    container_name: airflow
    depends_on:
      postgres-source:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      # Cấu hình tài khoản Admin cố định
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=password
      - _AIRFLOW_WWW_USER_ROLE=Admin
      - _AIRFLOW_WWW_USER_EMAIL=admin@example.com
      # Auto-connections
      - AIRFLOW_CONN_POSTGRES_DEFAULT=postgres://${DB_SOURCE_USER:-admin}:${DB_SOURCE_PASSWORD:-password}@postgres-source:5432/${DB_SOURCE_NAME:-hospital_db}
      - AIRFLOW_CONN_SPARK_DEFAULT=spark://local?master=local%5B*%5D
      - AIRFLOW_CONN_AWS_DEFAULT=aws://${MINIO_ROOT_USER:-lakehouse_admin}:${MINIO_ROOT_PASSWORD:-Lakehouse123!}@?endpoint_url=http%3A%2F%2Fminio%3A9000
      # Lakehouse Config
      - PG_HOST=postgres-source
      - PG_DB=${DB_SOURCE_NAME:-hospital_db}
      - PG_USER=${DB_SOURCE_USER:-admin}
      - PG_PASSWORD=${DB_SOURCE_PASSWORD:-password}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-lakehouse_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-Lakehouse123!}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-lakehouse_admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-Lakehouse123!}
    networks:
      - lakehouse_net
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/spark/scripts
      - ../jars:/opt/spark/jars
      - ../data:/data_source
    ports:
      - "8080:8080"
    command: standalone

  # 6. Spark Iceberg Lab (Optional - Cho Notebooks)
  spark-iceberg:
    image: tabulario/spark-iceberg:latest
    container_name: spark-iceberg
    depends_on:
      - minio
      - hive-metastore
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-lakehouse_admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-Lakehouse123!}
      - AWS_REGION=us-east-1
      - SPARK_CONF_spark_sql_catalog_hospital=org.apache.iceberg.spark.SparkCatalog
      - SPARK_CONF_spark_sql_catalog_hospital_catalog-impl=org.apache.iceberg.hive.HiveCatalog
      - SPARK_CONF_spark_sql_catalog_hospital_uri=thrift://hive-metastore:9083
      - SPARK_CONF_spark_sql_catalog_hospital_warehouse=s3a://hospital-lakehouse/warehouse
      - SPARK_CONF_spark_hadoop_fs_s3a_endpoint=http://minio:9000
      - SPARK_CONF_spark_hadoop_fs_s3a_path_style_access=true
    networks:
      - lakehouse_net
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./notebooks:/home/iceberg/notebooks

  # 7. Trino - SQL Serving Layer
  trino:
    image: trinodb/trino:480
    container_name: trino
    depends_on:
      minio:
        condition: service_healthy
      hive-metastore:
        condition: service_started
    networks:
      - lakehouse_net
    ports:
      - "8081:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog

  # 8. Superset - BI Dashboard Layer
  superset:
    build:
      context: ./superset/docker
      dockerfile: Dockerfile
    container_name: superset
    depends_on:
      trino:
        condition: service_started
    environment:
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config.py
      - SUPERSET_ADMIN_USERNAME=${SUPERSET_ADMIN_USERNAME:-admin}
      - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD:-admin}
      - SUPERSET_ADMIN_FIRSTNAME=${SUPERSET_ADMIN_FIRSTNAME:-Admin}
      - SUPERSET_ADMIN_LASTNAME=${SUPERSET_ADMIN_LASTNAME:-User}
      - SUPERSET_ADMIN_EMAIL=${SUPERSET_ADMIN_EMAIL:-admin@example.com}
    networks:
      - lakehouse_net
    ports:
      - "8088:8088"
    volumes:
      - ./superset/config/superset_config.py:/app/pythonpath/superset_config.py
      - ./superset/docker/superset_init.sh:/app/superset_init.sh
      - superset_home:/app/superset_home
    command: ["/bin/sh", "/app/superset_init.sh"]

networks:
  lakehouse_net:
    name: lakehouse_net

volumes:
  airflow_data:
  superset_home:
